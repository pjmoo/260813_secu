<!doctype html>
<html lang="ko" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>소셜 로그인</title>
</head>
<body>
<h1>소셜 로그인</h1>
<form method="post" th:action="@{/comment}">
    <label>내용 : <input type="text" name="content"></label>
    <button>작성</button>
</form>
<section>
    <div th:each="comment : ${data}">
        <p>댓글ID : [[${comment.id}]]</p>
        <p>내용 : [[${comment.content}]]</p>
        <p>작성자 : [[${comment.user.username}]]</p>
        <section th:if="${admin}" sec:authorize="hasRole('ADMIN')">
            <form method="post" th:action="@{/comment/{id}/delete(id=${comment.id})}">
                <button>삭제</button>
            </form>
        </section>
        <section th:if="${#authentication.principal.id == comment.user.id}">
            <form method="post" th:action="@{/comment/{id}/delete(id=${comment.id})}">
                <button>삭제</button>
            </form>
        </section>
    </div>
</section>
</body>
</html>
